[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "storage", "apify_storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
  "live: hits i.ytimg.com and youtube.com/oembed; opt in with -m live, excluded by default",
]
